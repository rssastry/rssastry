name: Daily Market Scan

# Two scheduled runs every weekday on GitHub's free runners, both committing
# the fresh results back to `main`:
#   1. 08:00 IST pre-market briefing (02:30 UTC) — the morning scan the
#      bundled scheduler would do locally, delivered before the 9:15 open.
#   2. 15:45 IST post-close confirmation (10:15 UTC) — same-day completed
#      bar, so the dashboard always shows the latest close at market end.
#
# Why this exists: Render's free tier has an EPHEMERAL filesystem and only
# runs `streamlit run dashboard.py` — it never starts the bundled scheduler
# (`python run.py scheduler`) and any file written at runtime is wiped on the
# next restart/redeploy. This workflow is the free, reliable replacement for
# both problems: it triggers the scan automatically, and because Render has
# `autoDeploy: true`, a successful push redeploys the dashboard with the new
# `ai_analysis.json` / `screener_results.json` / refreshed price CSVs, so the
# live site stops "starting from fresh" every time it is opened.

on:
  schedule:
    - cron: "30 2 * * 1-5"    # 08:00 IST pre-market briefing (02:30 UTC)
    - cron: "15 10 * * 1-5"   # 15:45 IST post-close confirmation (10:15 UTC)
  workflow_dispatch:         # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # At least one AI key is REQUIRED. Add these as GitHub repository
      # secrets: Settings → Secrets and variables → Actions.
      # GROQ_API_KEY (free) is enough; GEMINI_API_KEY/OPENROUTER_API_KEY are
      # fallback engines. TELEGRAM_* are optional (alerts only).
      - name: Inject API keys
        run: |
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> .env
          echo "OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}" >> .env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env

      # schedular.job_morning_scan(): refreshes the price CSVs, captures
      # fundamental snapshots, screens the universe, runs the AI second
      # opinion, monitors open positions against their stop/target plan and
      # sends Telegram alerts. It skips weekends and NSE holidays on its own.
      # A failure must not block committing partial results.
      - name: Run scheduled scan
        run: |
          python schedular.py morning || true

      - name: Commit scan results
        run: |
          git config user.name "market-scan-bot"
          git config user.email "market-scan-bot@users.noreply.github.com"
          git add raw_data/prices
          git add ai_analysis.json ai_analysis_progress.json screener_results.json portfolio.json
          git add -f signals_log.csv journal_report.json market_snapshot.json portfolio_discipline_report.json 2>/dev/null || true
          git add -f data_cache/fundamental_snapshots 2>/dev/null || true
          git status --porcelain
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "daily scan results $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin HEAD:main
          fi