name: CI

# Runs the unit-test suite on every push and pull request so regressions in
# the screening / validation / journal / paper-broker logic are caught
# automatically. The suite is network-independent (mocked providers) and does
# not require a .env file.

on:
  push:
    branches: [main, Development]
  pull_request:
    branches: [main, Development]
  workflow_dispatch:      # allow manual runs from the Actions tab

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests -q

      - name: Compile-check all modules
        run: |
          python -m py_compile *.py
